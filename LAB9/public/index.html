<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Web Push Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App และ Messaging SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">FCM Notification</h1>
            <p class="text-gray-500 mt-2">ทดสอบการรับข้อความแจ้งเตือนผ่านเว็บ</p>
        </div>

        <div id="setup-section" class="space-y-4">
            <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                <div class="flex">
                    <div class="ml-3">
                        <p class="text-sm text-yellow-700">
                            กรุณาระบุ <strong>Firebase Config</strong> ของคุณในโค้ดเพื่อเริ่มใช้งาน
                        </p>
                    </div>
                </div>
            </div>

            <button id="btn-permission" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                ขอสิทธิ์การแจ้งเตือน
            </button>
        </div>

        <div id="token-section" class="hidden mt-6 space-y-4">
            <label class="block text-sm font-medium text-gray-700">Registration Token (FCM Token)</label>
            <div class="relative">
                <textarea id="token-display" readonly class="w-full p-3 bg-gray-100 border border-gray-300 rounded-lg text-xs break-all h-24 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                <button onclick="copyToken()" class="absolute top-2 right-2 bg-white border border-gray-300 rounded p-1 hover:bg-gray-50 text-xs">
                    คัดลอก
                </button>
            </div>
            <p class="text-xs text-green-600 font-medium italic">* ใช้ Token นี้ส่งข้อความทดสอบจาก Firebase Console</p>
        </div>

        <div id="message-container" class="mt-8 hidden">
            <h3 class="text-sm font-bold text-gray-800 mb-2 uppercase tracking-wider">ข้อความล่าสุด:</h3>
            <div id="latest-message" class="bg-blue-50 border border-blue-200 rounded-lg p-4 animate-pulse">
                รอกำลังรับข้อมูล...
            </div>
        </div>

        <div id="status-log" class="mt-6 text-[10px] text-gray-400 font-mono h-20 overflow-y-auto border-t pt-2">
            <div>Log: กำลังรอการตั้งค่า...</div>
        </div>
    </div>

    <script>
        // === การตั้งค่า Firebase (กรุณาแทนที่ด้วย Config ของคุณ) ===
        const firebaseConfig = {
            apiKey: "AIzaSyAfmiZXi5ZGz2NOnJ-ZtlPOhlvVTVfs-ac",
            authDomain: "palmwulin.firebaseapp.com",
            projectId: "palmwulin",
            storageBucket: "palmwulin.firebasestorage.app",
            messagingSenderId: "946634707361",
            appId: "1:946634707361:web:558b746310b5abb988fbe0"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const messaging = firebase.messaging();

        const btnPermission = document.getElementById('btn-permission');
        const tokenSection = document.getElementById('token-section');
        const tokenDisplay = document.getElementById('token-display');
        const statusLog = document.getElementById('status-log');
        const messageContainer = document.getElementById('message-container');
        const latestMsgBox = document.getElementById('latest-message');

        function addLog(msg) {
            const div = document.createElement('div');
            div.textContent = `> ${new Date().toLocaleTimeString()}: ${msg}`;
            statusLog.prepend(div);
        }

        // ขอสิทธิ์การแจ้งเตือน
        btnPermission.addEventListener('click', () => {
            addLog("กำลังขอสิทธิ์การแจ้งเตือน...");
            
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    addLog("ได้รับสิทธิ์แล้ว! กำลังดึง Token...");
                    getToken();
                } else {
                    addLog("ผู้ใช้ปฏิเสธการให้สิทธิ์");
                    alert("กรุณาเปิดการแจ้งเตือนใน Browser");
                }
            });
        });

        async function getToken() {
            try {
                // สำหรับการใช้งานจริง ต้องมีไฟล์ firebase-messaging-sw.js ใน Root
                // ในที่นี้คือการสาธิตการดึง Token
                const currentToken = await messaging.getToken({ 
                    vapidKey: 'BDRcJ2necSvyTyGesFrpql19FchhrcRfhSWGpUSI2WaVale5ZVmo5GpDtEpkeLz4gdbPCvI1j5rJK71uuU27xgE' // ใส่ Web Push Key จาก Firebase Console
                });

                if (currentToken) {
                    tokenDisplay.value = currentToken;
                    tokenSection.classList.remove('hidden');
                    btnPermission.innerText = "ลงทะเบียนสำเร็จแล้ว";
                    btnPermission.disabled = true;
                    btnPermission.classList.replace('bg-blue-600', 'bg-green-500');
                    addLog("ได้รับ Token เรียบร้อย");
                } else {
                    addLog("ไม่สามารถดึง Token ได้ กรุณาตรวจสอบ VAPID Key");
                }
            } catch (err) {
                addLog("เกิดข้อผิดพลาด: " + err.message);
                console.error(err);
            }
        }

        // จัดการข้อความเมื่อเปิดแอปอยู่ (Foreground)
        messaging.onMessage((payload) => {
            console.log('Message received. ', payload);
            addLog("ได้รับข้อความใหม่!");
            
            messageContainer.classList.remove('hidden');
            latestMsgBox.classList.remove('animate-pulse');
            latestMsgBox.innerHTML = `
                <div class="font-bold text-blue-800">${payload.notification.title}</div>
                <div class="text-sm text-blue-600">${payload.notification.body}</div>
            `;
            
            // แสดง Notification จำลอง (เนื่องจาก Service Worker มักไม่ทำงานใน Preview environment)
            new Notification(payload.notification.title, {
                body: payload.notification.body,
                icon: 'https://cdn-icons-png.flaticon.com/512/732/732200.png'
            });
        });

        function copyToken() {
            tokenDisplay.select();
            document.execCommand('copy');
            addLog("คัดลอก Token ลง Clipboard แล้ว");
        }

        // ตรวจสอบเบื้องต้น
        window.onload = () => {
            if (!('Notification' in window)) {
                addLog("Browser นี้ไม่รองรับการแจ้งเตือน");
                btnPermission.disabled = true;
                btnPermission.innerText = "ไม่รองรับ";
            } else {
                addLog("พร้อมใช้งาน");
            }
        };
    </script>
</body>
</html>
